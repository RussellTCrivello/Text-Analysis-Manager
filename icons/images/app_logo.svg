<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Main gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    
    <!-- Gold accent gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D"/>
      <stop offset="100%" style="stop-color:#FBBF24"/>
    </linearGradient>
    
    <!-- Database gradient -->
    <linearGradient id="dbGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#93C5FD"/>
      <stop offset="50%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    
    <!-- Inner shadow filter -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="2" dy="2" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
    
    <!-- Drop shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#1E3A8A" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background rounded rectangle -->
  <rect x="12" y="12" width="232" height="232" rx="48" ry="48" 
        fill="url(#bgGradient)" filter="url(#dropShadow)"/>
  
  <!-- Open Book - Main Element -->
  <g transform="translate(128, 105)">
    <!-- Book spine -->
    <rect x="-3" y="-45" width="6" height="90" fill="#1E3A8A"/>
    
    <!-- Left page -->
    <path d="M-3,-45 L-70,-35 L-70,40 L-3,45 Z" fill="white"/>
    
    <!-- Right page -->
    <path d="M3,-45 L70,-35 L70,40 L3,45 Z" fill="#E0F2FE"/>
    
    <!-- Text lines on left page -->
    <line x1="-60" y1="-25" x2="-10" y2="-25" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
    <line x1="-60" y1="-10" x2="-10" y2="-10" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
    <line x1="-60" y1="5" x2="-35" y2="5" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Text lines on right page -->
    <line x1="10" y1="-25" x2="60" y2="-25" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-10" x2="60" y2="-10" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="5" x2="35" y2="5" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Database Cylinder - Bottom Right -->
  <g transform="translate(175, 160)">
    <!-- Bottom ellipse (shadow) -->
    <ellipse cx="2" cy="27" rx="28" ry="10" fill="#1E3A8A" opacity="0.3"/>
    
    <!-- Cylinder body -->
    <path d="M-26,-15 L-26,22 A26,9 0 0,0 26,22 L26,-15" fill="url(#dbGradient)"/>
    
    <!-- Horizontal stripes -->
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#2563EB" stroke-width="2"/>
    <line x1="-26" y1="12" x2="26" y2="12" stroke="#2563EB" stroke-width="2"/>
    
    <!-- Top ellipse -->
    <ellipse cx="0" cy="-15" rx="26" ry="9" fill="#93C5FD"/>
    
    <!-- Top highlight -->
    <path d="M-18,-17 A20,6 0 0,1 18,-17" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Magnifying Glass - Top Right -->
  <g transform="translate(175, 75)">
    <!-- Handle -->
    <line x1="14" y1="14" x2="32" y2="32" stroke="url(#goldGradient)" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Glass rim -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="url(#goldGradient)" stroke-width="5"/>
    
    <!-- Glass interior (transparent effect) -->
    <circle cx="0" cy="0" r="14" fill="#1E3A8A" opacity="0.15"/>
    
    <!-- Glass highlight -->
    <path d="M-10,-8 A12,12 0 0,1 -2,-12" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
  </g>
  
  <!-- Connection dots -->
  <circle cx="70" cy="95" r="5" fill="url(#goldGradient)">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="85" cy="165" r="5" fill="url(#goldGradient)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="195" cy="55" r="4" fill="url(#goldGradient)">
    <animate attributeName="opacity" values="1;0.7;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Subtle connection lines -->
  <line x1="128" y1="110" x2="160" y2="145" stroke="#FBBF24" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
</svg>
